[project]
name = "neo_view"
authors = [
    {name="Sage Santomenna", email = "sage.santomenna@gmail.com"},
]
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    'astropy',
    'fastapi',
    'colorlog',
    'matplotlib',
    'numpy',
    'pandas',
    'python-dotenv',
    'pytz',
    'requests',
    'scikit-image',
    'scipy',
    'seaborn',
    'tomli',
    'tomlkit',
    'tqdm',
    'rich',
    'ccdproc',
    'sqlalchemy',
    'beautifulsoup4',
    'html5lib',
    'uvicorn',
    'psycopg[binary]',
    'apscheduler>=3,<4',
    'alembic'
]


[project.scripts]
tmo-ingest = "run_ingest:main"
tmo-obs-ingest = "obs_ingest:main"
tmo-mpc-ingest = "mpc_ingest:main"
tmo-classify = "classification:main"
tmo-ingest-service = "ingest_service:main"

[tool.setuptools.packages.find]
where = ["."]
# namespaces default to true, so dirs without __init__ get installed as packages
exclude = ["testing*", "thumbnails*", "migrations*"]

[tool.setuptools]
# loose top-level scripts, not packages -- must be listed explicitly
py-modules = ["run_ingest", "obs_ingest", "mpc_ingest", "classification", "ingest_service", "results_ingest"]